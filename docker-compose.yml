# Local services. One shared set of containers for all worktrees.
# The project keeps the template's name: renaming it would start new, empty
# volumes, and postgres-data holds termrise_local, the workbench's data
# (docs/architecture/environment.md#always-on). Every service restarts with
# Docker, so a reboot or an OrbStack update brings the workbench back.
name: saas-starter

services:
  # PostgreSQL for the automated tests (docs/architecture/testing.md; each worktree
  # uses its own database) and for termrise_local, the workbench's own data.
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: postgres
    ports:
      - "54330:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 2s
      timeout: 3s
      retries: 15

  # S3-compatible stand-in for R2 in local development (docs/architecture/storage.md).
  # Creates the app-dev bucket on start; local-only credentials.
  storage:
    image: chrislusf/seaweedfs:4.48
    restart: unless-stopped
    command: ["mini", "-s3.allowedOrigins=http://localhost:3000"]
    environment:
      AWS_ACCESS_KEY_ID: local
      AWS_SECRET_ACCESS_KEY: local-secret
      S3_BUCKET: app-dev
    ports:
      - "8333:8333"
    volumes:
      - storage-data:/data

  # Stand-in for Upstash Redis: the worker's BullMQ queue (docs/architecture/jobs.md).
  # Tests use database 1 (TEST_REDIS_URL), local development database 0.
  redis:
    image: redis:8-alpine
    restart: unless-stopped
    ports:
      - "63790:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 3s
      retries: 15

volumes:
  postgres-data:
  storage-data:
